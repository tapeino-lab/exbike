<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#efe6d2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>EX-BIKE</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="device">
      <div class="bezel">
        <div class="bezel-top">
          <span class="led" aria-hidden="true"></span>
          <span class="bezel-label">POWER</span>
          <span class="bezel-line" aria-hidden="true"></span>
        </div>
        <div class="screen-wrap" id="screen-wrap">
          <canvas id="screen" width="240" height="216"></canvas>
        </div>
      </div>

      <div class="brand">
        <span class="brand-name">EX-BIKE</span>
        <span class="brand-sub">POCKET MOTOCROSS</span>
      </div>

      <div class="controls">
        <div id="dpad" class="dpad" data-v="0" data-h="0" aria-label="じゅうじキー">
          <div class="cross" aria-hidden="true">
            <span class="arm up"></span>
            <span class="arm down"></span>
            <span class="arm left"></span>
            <span class="arm right"></span>
            <span class="hub"></span>
          </div>
        </div>
        <div id="ab" class="ab">
          <div class="ab-row">
            <div id="b" class="btn"><span>B</span></div>
            <div id="a" class="btn"><span>A</span></div>
          </div>
          <div class="ab-labels" aria-hidden="true">
            <span>ターボ</span>
            <span>かそく</span>
          </div>
          <p class="ab-hint">片手OK：押したまま↑↓でレーン</p>
        </div>
      </div>

      <div class="meta">
        <div class="meta-btn">
          <button id="select" type="button" aria-label="SELECT"></button>
          <span>SELECT</span>
        </div>
        <div class="meta-btn">
          <button id="start" type="button" aria-label="START"></button>
          <span>START</span>
        </div>
        <div class="speaker" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>
    </div>

    <div id="rotate-note" class="rotate-note">スマホを たてに してね</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
